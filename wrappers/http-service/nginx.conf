worker_processes 1;
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Write temp files to /tmp so non-root can work
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log /dev/stdout;

    sendfile    on;
    tcp_nopush  on;

    # Match the ACA ingress timeout
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 10s;

    # Allow large file uploads (assessments)
    client_max_body_size 100M;

    upstream api {
        server 127.0.0.1:8080;
    }

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    server {
        listen 8000;

        # ── API: /api/* → FastAPI (strip /api prefix) ────────────
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health probes (no prefix, direct to API) ─────────────
        location = /healthz {
            proxy_pass http://api/healthz;
        }

        location = /ready {
            proxy_pass http://api/ready;
        }

        # ── Streamlit: everything else ───────────────────────────
        location / {
            proxy_pass http://streamlit;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamlit uses WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
